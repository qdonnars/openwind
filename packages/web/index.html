<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Pas de maximum-scale ni de user-scalable=no : bloquer le zoom viole
         le critere WCAG 1.4.4 (redimensionnement du texte), et c'etait inutile
         ici. Le double-tap sur la carte est deja neutralise par
         `touch-action: manipulation` sur .leaflet-container, MapLibre gere le
         pincement dans son conteneur, et iOS ignore l'interdiction depuis
         longtemps. viewport-fit=cover laisse la page passer sous les encoches
         et la barre de geste, comme l'attend le mode standalone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- ... l'en-tete ajoute les marges de securite a son propre padding
         (.app-header dans index.css) ; le bas n'est volontairement pas
         reserve, l'indicateur d'accueil passe sur la derniere ligne. -->
    <title>OhMyWind</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#030712" />
    <!-- Le nom standard d'abord, la variante Apple ensuite : Chrome previent en
         console quand seule la seconde est presente, et Safari ne lit que la
         sienne. Les deux disent la meme chose, garder les deux ne coute rien. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Barre d'etat opaque, pas translucide : en translucide, iOS pose la
         barre par-dessus la page et c'est a la page de reserver la place via
         env(safe-area-inset-top), ce qui n'a pas suffi sur un iPhone en mode
         ecran d'accueil (champ de recherche sous la camera, 2026-09-06). En
         "default", la page commence sous la barre, quoi qu'il arrive, et iOS
         peint la barre de la couleur de theme-color, que le theme tient a
         jour (design/initialTheme.ts). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="OhMyWind" />

    <meta name="description" content="OhMyWind, sailing planner for the French Atlantic and Mediterranean coasts. Wind forecasts, passage estimates, complexity scores and high-precision tidal currents (SHOM Atlas C2D + MARC PREVIMER), powered by AROME 1.3 km models.">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ohmywind.fr/">
    <meta property="og:title" content="OhMyWind, French Atlantic and Mediterranean sailing planner">
    <meta property="og:description" content="Wind forecasts, passage estimates, complexity scores and high-precision tidal currents for the French Atlantic and Mediterranean coasts. Powered by AROME 1.3 km, SHOM Atlas C2D and MARC PREVIMER.">
    <meta property="og:image" content="https://ohmywind.fr/icon-512.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="OhMyWind, French Atlantic and Mediterranean sailing planner">
    <meta name="twitter:description" content="Wind forecasts, passage estimates, complexity scores and SHOM-grade tidal currents for the French Atlantic and Mediterranean coasts.">
    <meta name="twitter:image" content="https://ohmywind.fr/icon-512.png">

    <!-- Canonical -->
    <link rel="canonical" href="https://ohmywind.fr/">

    <!-- Fond de carte. C'est la seule origine tierce sollicitee au
         chargement, et elle l'est tot : ouvrir la connexion des l'analyse du
         document evite la poignee de main TLS sur le chemin critique. Les
         geocodeurs, eux, n'etaient jamais contactes avant une frappe au
         clavier : leurs preconnect ne servaient a rien et consommaient un
         emplacement de connexion. -->
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>

    <!-- Pas de preload des polices, volontairement. Inter latin en avait un ;
         Firefox signalait a chaque chargement une ressource prechargee mais
         jamais utilisee, parce que le service worker sert la police depuis son
         precache et que Firefox n'apparie pas cette reponse au preload. Le
         gain ne valait que la toute premiere visite, avant le precache. -->

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- iOS veut un PNG opaque de 180 x 180 sous ce nom canonique, qu'il
         cherche aussi tout seul a la racine. Declaree en maskable 512 avec
         un attribut sizes, l'icone n'apparaissait pas sur l'ecran d'accueil
         (iPhone, 2026-09-04) : Safari retombait sur une capture de la page. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Structured data: Organization logo for Google search -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "OhMyWind",
        "url": "https://ohmywind.fr",
        "logo": "https://ohmywind.fr/icon-512.png"
      }
    </script>
  </head>
  <body class="bg-surface-0 text-ink-0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
